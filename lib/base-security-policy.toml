# allow `val := os.Getenv("..."); if len(val) == 0 { return; }` (common pattern)
"builtin.len" = ["$env"]

# ==============================================================================
[allow_sinks] # === AXIS-RESTRICTING WHITELIST-BASED ENFORCEMENT CHECKS ========
# ==============================================================================

# The base policy does not define allow-sinks, as whitelists are most useful for
# domain-specific trust boundaries. For example, a `/profile` endpoint may wish
# to whitelist `{user:full-name, user:bio, user:phone-number}`, but it is not
# possible for this base policy to make decisions about such particular cases.

# ==============================================================================
[deny_sinks] # === BLACKLIST-BASED ENFORCEMENT CHECKS ==========================
# ==============================================================================

