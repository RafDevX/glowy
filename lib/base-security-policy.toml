# Glowy Base Security Policy
# ==========================

# IMPORTANT: These are deliberately selective heuristics, encoding sensible
# security assumptions for arbitrary Go programs, but each project requires
# domain-specific adjustments to extract the most possible value from Glowy with
# respect to the possible security guarantees offered by analysis.

# Convention: all tags in this policy use either the `secret` axis (shorthand:
# prefix `$`) or the `untrusted` axis (shorthand: prefix `?`). No other axes are
# used, as they would necessarily be specific to the domain under analysis.

# If using this policy as a template, modifying it to better suit the project's
# needs, ensure that the canonical base policy that Glowy ships with is disabled
# to avoid clashes with project-adjusted blanket directives.
inherit_base_policy = false

# ==============================================================================
[sources] # === ROOTS FOR TAINT PROPAGATION ====================================
# ==============================================================================

# --- Confidentiality: environment-derived credentials -------------------------
