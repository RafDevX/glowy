[package]
name = "glowy"
description = "Information flow control analysis for Go"
readme = "../README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["base-security-policy", "parallelism", "toml-config"]
base-security-policy = ["toml-config"]
parallelism = ["dep:rayon", "indexmap/rayon"]
toml-config = ["indexmap/serde", "dep:serde", "dep:toml"]

[dependencies]
indexmap = "2.14.0"
parser = { path = "../parser" }
rayon = { version = "1.12.0", optional = true }
regex.workspace = true
serde = { version = "1.0.228", features = ["derive"], optional = true }
subenum = "1.1.3"
toml = { version = "1.1.2", optional = true }
uuid = { version = "1.19.0", features = ["v4"] }

[dev-dependencies]
test-generator = "0.3.1"
