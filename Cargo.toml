[package]
name = "glowy"
description = "Information flow control analysis for Go"
documentation = "https://glowy.rso.pt/glowy"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true

[workspace]
members = [".", "parser"]

[workspace.dependencies]
codespan-reporting = "0.13.1"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Rafael Oliveira", "Diogo Correia"]
repository = "https://github.com/RafDevX/glowy"
keywords = ["security", "tool", "go", "static-analysis"]
categories = [
    "security",
    "development-tools",
    "command-line-utilities",
    "parser-implementations",
]
license = "MIT"
rust-version = "1.87"

[dependencies]
annotate-snippets = "0.12.10"
anstream = "1.0.0"
clap = { version = "4.5.51", features = ["derive"] }
colored = "3.1.1"
parser = { path = "parser" }
uuid = { version = "1.19.0", features = ["v4"] }
